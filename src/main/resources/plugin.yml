name: ManosabaCore
version: '${version}'
main: io.github.manosaba.core.ManosabaCore
description: '${description}'
author: Manosaba
api-version: '1.21'
load: POSTWORLD
prefix: ManosabaCore
folia-supported: false
default-permission: op
softdepend: [voicechat, ProtocolLib]

commands:
  manosaba:
    description: ManosabaCore root command
    usage: /<command> [reload|version|help]
    aliases: [mc, manosabacore]
    permission: manosaba.command
  hub:
    description: Return to the map hub.
    usage: /hub
    permission: manosaba.alias.hub
    permission-message: You do not have permission to use this command.
  checkperm:
    description: Check the current map permissions.
    usage: /checkperm
    permission: manosaba.alias.checkperm
    permission-message: You do not have permission to use this command.
  reset:
    description: Reload Manosaba map debug state.
    usage: /reset
    permission: manosaba.alias.reset
    permission-message: You do not have permission to use this command.

permissions:
  manosaba.command:
    description: Use the /manosaba command (subcommands are separately permissioned).
    default: true
  manosaba.command.reload:
    description: Reload ManosabaCore configuration from disk.
    default: op
  manosaba.alias:
    description: Use all Manosaba map command aliases.
    default: false
    children:
      manosaba.alias.hub: true
      manosaba.alias.checkperm: true
      manosaba.alias.reset: true
  manosaba.alias.hub:
    description: Use the /hub map command alias.
    default: true
  manosaba.alias.checkperm:
    description: Use the /checkperm map command alias.
    default: op
  manosaba.alias.reset:
    description: Use the /reset map command alias.
    default: op
  manosaba.chat.bypass.send:
    description: Sender's chat ignores proximity restrictions.
    default: false
  manosaba.chat.bypass.receive:
    description: Always receive proximity-restricted chat regardless of distance.
    default: false
  manosaba.tablist.reveal:
    description: See the real game mode of dead players in the tablist.
    default: op
